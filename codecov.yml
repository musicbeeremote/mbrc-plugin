codecov:
  branch: main

coverage:
  status:
    project: false
    patch: false

github_checks: false

# Each half of the tree is uploaded by its own path-filtered workflow, so a
# commit touching only one half has no upload for the other. Carryforward is
# what stops Codecov reading that absence as zero coverage for the half that
# did not run.
flag_management:
  individual_flags:
    - name: csharp
      carryforward: true
      paths:
        - packages/plugin/
        - tests/csharp/
    - name: rust
      carryforward: true
      paths:
        - packages/mbrc-
    - name: web
      carryforward: true
      paths:
        - packages/web-app/src/

# Only what reaches a user's machine is measured, so the workbench is not
# reported as if it shipped. The CLI and the lint tool are developer tools,
# mbrc-capture is a dev dependency, mbrc-discovery belongs to the CLI, and
# mbrc-buildinfo runs at build time. Their tests still run in CI.
ignore:
  - tools/
  - packages/mbrc-capture/
  - packages/mbrc-discovery/
  - packages/mbrc-buildinfo/
