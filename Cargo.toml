# Root Rust workspace for MusicBee Remote.
#
# Holds the shared library crates (packages/mbrc-*), the headless CLI
# (tools/mbrc-cli), and later the Rust plugin core (packages/mbrc-core).
#
# The Tauri api-debugger (tools/api-debugger/src-tauri) is deliberately its OWN
# workspace and is excluded here: it path-depends into the shared crates but
# keeps the heavy webview toolchain out of this workspace's cargo test / CI.
[workspace]
resolver = "3"
members = [
    "packages/mbrc-buildinfo",
    "packages/mbrc-core",
    "packages/mbrc-release",
    "packages/mbrc-helper",
    "packages/mbrc-discovery",
    "packages/mbrc-wire",
    "packages/mbrc-capture",
    "tools/mbrc-cli",
    "tools/mbrc-lint",
]
exclude = ["tools/api-debugger/src-tauri"]

[workspace.package]
edition = "2024"
# The floor every member is built against, and the one rustc the toolchain file
# pins. Declaring it is what makes cargo name the crate that wants a newer
# compiler, rather than failing inside its source; with resolver 3 cargo picks
# an older compatible version of a transitive dependency instead of erroring.
rust-version = "1.98"
authors = ["Konstantinos Paparas"]
# GPL-3.0 plus a linking exception for MusicBee itself, which SPDX cannot
# express, so the file is the licence rather than an expression naming it.
license-file = "LICENSE"

# A doc comment opens with a summary, not a paragraph of rationale. See the
# "Comments and documentation" section of CLAUDE.md.
[workspace.lints.clippy]
too_long_first_doc_paragraph = "warn"
# Every unsafe block states why it is sound. The FFI boundary is most of the
# unsafe in this workspace, and "the caller's contract" is only a real answer
# when it is written down next to the block that relies on it.
undocumented_unsafe_blocks = "warn"
# Nesting and branching, not length: a flat 60-line match of wire quirks is
# easy to read, a 25-line function three levels deep is not. Nursery, which the
# exact toolchain pin makes safe to rely on.
cognitive_complexity = "warn"
# The backstop for what the metric above forgives. 100 sits just above the
# tree's p99, so it catches outliers rather than arguing with ordinary work.
too_many_lines = "warn"
# A panic in the core unwinds into MusicBee's own thread. `expect` stays
# available because its message is the argument for why the case cannot
# happen; a bare `unwrap` makes that argument without stating it. Tests are
# exempt via clippy.toml.
unwrap_used = "warn"

# Exact-version pins match the api-debugger's supply-chain hardening so both
# workspaces resolve the shared crates against identical dependency versions.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# preserve_order keeps JSON object keys in the order structs/`json!` literals
# declare them, instead of BTreeMap's alphabetical sort. The V4 clients (iOS
# especially) read the wire in the field order the shipped C# plugin emitted,
# so the core must match that order, not alphabetize.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.1", features = ["net", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time", "fs", "signal"] }
time = { version = "=0.3.55", features = ["formatting"] }
if-addrs = "=0.15.0"
mbrc-wire = { path = "packages/mbrc-wire" }
mbrc-capture = { path = "packages/mbrc-capture" }
mbrc-buildinfo = { path = "packages/mbrc-buildinfo" }
mbrc-discovery = { path = "packages/mbrc-discovery" }
# default-features = false so the helper gets only the manifest verifier; the
# core opts into `client` (the check/download/stage half) explicitly. Declared
# here rather than per-member because Cargo does not let a member turn off a
# workspace dependency's default features.
mbrc-release = { path = "packages/mbrc-release", default-features = false }

# Size-optimised release build; only affects `--release` (cargo test uses dev).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The plugin cdylib profile. Same size optimisation as release, but
# panic = "unwind" so the FFI boundary's catch_unwind actually catches a Rust
# panic and returns an error code instead of aborting the MusicBee host
# process. Build the core with `--profile plugin`.
[profile.plugin]
inherits = "release"
panic = "unwind"
