[package]
name = "mbrc-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
authors.workspace = true
description = "Headless CLI for the MusicBee Remote wire protocol and mbrc-capture traces."

[[bin]]
name = "mbrc"
path = "src/main.rs"

[dependencies]
mbrc-wire = { workspace = true }
mbrc-capture = { workspace = true }
mbrc-discovery = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Test-only: the core's own op list and read/write classification, so a test
# fails when the V6 fuzzer has no spec for a new read-only op.
[dev-dependencies]
mbrc-core = { path = "../../packages/mbrc-core" }

[lints]
workspace = true
