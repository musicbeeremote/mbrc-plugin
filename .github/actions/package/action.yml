name: package
description: >-
  Build the NSIS installer and zip from build/dist, emit SHA512 sidecars and the
  signed-release manifest, and optionally attest build provenance. The work is
  done by tools/package.ps1, which a maintainer also runs locally, so a
  published package and a local one are built by one implementation.

inputs:
  version:
    description: 'Full version string, e.g. 1.5.0 or 1.5.0-nightly.20260729.'
    required: true
  channel:
    description: 'Release channel recorded in the manifest: stable or testing (published as a GitHub pre-release).'
    required: false
    default: 'stable'
  notes-url:
    description: 'Release notes URL recorded in the manifest.'
    required: false
    default: ''
  attest:
    description: 'Publish build provenance attestations. Requires id-token: write and attestations: write on the calling job.'
    required: false
    default: 'false'

outputs:
  installer:
    description: 'Path to the built installer.'
    value: ${{ steps.names.outputs.INSTALLER }}
  zip:
    description: 'Path to the built zip archive.'
    value: ${{ steps.names.outputs.ZIP }}
  manifest:
    description: 'Path to the unsigned release manifest.'
    value: ${{ steps.names.outputs.MANIFEST }}

runs:
  using: composite
  steps:
    - name: resolve artifact names
      id: names
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # build/dist is fixed rather than an input: MusicBeeRemote.nsi pulls its
        # payload from a hardcoded ..\build\dist.
        $base = "musicbee_remote_$env:VERSION"
        echo "BASE=$base" >> $env:GITHUB_OUTPUT
        echo "INSTALLER=build/dist/$base.exe" >> $env:GITHUB_OUTPUT
        echo "ZIP=build/dist/$base.zip" >> $env:GITHUB_OUTPUT
        echo "MANIFEST=build/dist/manifest.json" >> $env:GITHUB_OUTPUT

    - name: install NSIS
      shell: pwsh
      run: choco install nsis -y

    - name: package
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
        NOTES_URL: ${{ inputs.notes-url }}
      run: |
        # -SkipBuild: the bundle was downloaded rather than rebuilt, so the
        # bytes that get hashed, signed and published are the bytes that were
        # tested. Everything after that is the same script a local package runs.
        ./tools/package.ps1 -Version $env:VERSION -Channel $env:CHANNEL -NotesUrl $env:NOTES_URL -SkipBuild

    - name: attest build provenance (installer)
      if: inputs.attest == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.names.outputs.INSTALLER }}

    - name: attest build provenance (zip)
      if: inputs.attest == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.names.outputs.ZIP }}

    - name: attest build provenance (manifest)
      if: inputs.attest == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.names.outputs.MANIFEST }}
