name: rust-workspace

# CI for the root Rust workspace: the plugin core (packages/mbrc-core), the
# shared crates (packages/mbrc-*), and the headless CLI (tools/mbrc-cli). The
# Tauri api-debugger has its own workflow (api-debugger.yml) and is excluded
# from this workspace, so it isn't built here. mbrc-core additionally gets an
# i686 cross-build (its ship target as the plugin's native cdylib) and the
# workspace runs its suite once, instrumented, on that same i686 target.
on:
  push:
    branches: [ main ]
    paths:
      - 'packages/mbrc-core/**'
      - 'packages/mbrc-wire/**'
      - 'packages/mbrc-capture/**'
      - 'packages/mbrc-discovery/**'
      - 'packages/mbrc-release/**'
      - 'packages/mbrc-helper/**'
      - 'packages/mbrc-buildinfo/**'
      - 'tools/mbrc-cli/**'
      - 'tools/mbrc-lint/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/mbrc-core/**'
      - 'packages/mbrc-wire/**'
      - 'packages/mbrc-capture/**'
      - 'packages/mbrc-discovery/**'
      - 'packages/mbrc-release/**'
      - 'packages/mbrc-helper/**'
      - 'packages/mbrc-buildinfo/**'
      - 'tools/mbrc-cli/**'
      - 'tools/mbrc-lint/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: fmt + clippy
    # Both operating systems compile every target here, tests included, so code
    # that only breaks on one still fails. Running the suite is the coverage
    # job's work, once, on the target the plugin ships as.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust components
        run: rustup component add rustfmt clippy

      - name: cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: check formatting
        run: cargo fmt --all --check

      - name: clippy (warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      # A doc link to a renamed item is invisible until someone reads the docs.
      # Ambiguity (`stage` the module vs the function) is caught here too, as is
      # a public doc pointing at a private item, which renders as bare text.
      - name: rustdoc (broken links as errors)
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags
            -D rustdoc::private_intra_doc_links -D rustdoc::redundant_explicit_links
        run: cargo doc --no-deps --workspace --locked

      # mbrc-core ships as the plugin's native cdylib built for 32-bit Windows,
      # and mbrc-helper ships beside it as the elevated helper exe. Cross-build
      # both on the Windows runner so i686-only breakage (linking, target-cfg,
      # pointer width) is caught here, not only in the C# CI. The helper's COM
      # code is `cfg(windows)`, so this is the only job that compiles it at all.
      - name: build mbrc-core + mbrc-helper (i686 plugin profile)
        if: matrix.os == 'windows-latest'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build -p mbrc-core -p mbrc-helper --target i686-pc-windows-msvc --profile plugin --locked

  # The suite runs once per PR, instrumented, on the target the plugin ships as.
  # A second run at another pointer width measured the same assertions twice and
  # bought a configuration nothing is released for; if another architecture ever
  # ships, it earns its own run then. The matrix above still compiles every
  # target's test code through clippy, so breakage elsewhere fails before this.
  coverage:
    name: coverage
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Rust (llvm-tools + the ship target)
        run: |
          rustup component add llvm-tools-preview
          rustup target add i686-pc-windows-msvc

      - name: cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install cargo-llvm-cov
        # Installed from crates.io (version-pinned) rather than a third-party
        # action; rust-cache keeps the compiled binary warm across runs.
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      # Only what ships is measured. mbrc-core, mbrc-wire, mbrc-release's client
      # half and mbrc-helper reach a user's machine; mbrc-capture is a dev
      # dependency, mbrc-discovery belongs to the CLI, mbrc-buildinfo runs at
      # build time, and tools/ is the workbench. Their tests still run here -
      # the whole workspace is exercised once - they are just not counted as
      # product coverage, which would report the workbench as if it shipped.
      - name: run the suite once, instrumented (i686, the ship target)
        run: >-
          cargo llvm-cov --workspace --locked
          --target i686-pc-windows-msvc
          --ignore-filename-regex '(tools|mbrc-capture|mbrc-discovery|mbrc-buildinfo)[/\\]|[/\\]tests[/\\]'
          --lcov --output-path lcov.info

      - name: upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # One report, one flag: what it holds is what ships.
          flags: rust
          fail_ci_if_error: false
          verbose: true
