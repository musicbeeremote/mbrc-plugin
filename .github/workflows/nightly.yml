name: nightly

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:     # Allow manual trigger

# Least-privilege default; jobs opt into more only where needed.
permissions:
  contents: read

# Never run two nightlies at once; don't cancel one already in flight.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    name: check if build needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read        # gh run list reads workflow run history
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if nightly needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get last successful nightly workflow run
          LAST_RUN=$(gh run list --workflow=nightly.yml --status=success --limit=1 --json createdAt,headSha -q '.[0]')

          if [ -z "$LAST_RUN" ] || [ "$LAST_RUN" = "null" ]; then
            echo "No previous successful nightly found, should build"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_RUN_DATE=$(echo "$LAST_RUN" | jq -r '.createdAt')
          LAST_RUN_SHA=$(echo "$LAST_RUN" | jq -r '.headSha')

          echo "Last successful nightly: $LAST_RUN_DATE (SHA: $LAST_RUN_SHA)"

          # Check if last run is older than 7 days
          LAST_RUN_EPOCH=$(date -d "$LAST_RUN_DATE" +%s)
          CURRENT_EPOCH=$(date +%s)
          SEVEN_DAYS=$((7 * 24 * 60 * 60))
          DAYS_AGO=$(( (CURRENT_EPOCH - LAST_RUN_EPOCH) / 86400 ))

          echo "Last nightly was $DAYS_AGO days ago"

          if [ $((CURRENT_EPOCH - LAST_RUN_EPOCH)) -lt $SEVEN_DAYS ]; then
            echo "Last nightly is less than 7 days old, skipping"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if there are new commits since last run
          COMMITS_SINCE=$(git rev-list --count "$LAST_RUN_SHA"..HEAD 2>/dev/null || echo "999")

          if [ "$COMMITS_SINCE" -eq 0 ]; then
            echo "No new commits since last nightly, skipping"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Nightly needed: $COMMITS_SINCE new commits, last nightly is $DAYS_AGO days old"
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "version=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

  build:
    name: build nightly
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version-suffix: nightly.${{ needs.check.outputs.version }}
      artifact-name: nightly-dist-${{ needs.check.outputs.version }}

  package:
    name: package nightly
    needs: [ check, build ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-dist-${{ needs.check.outputs.version }}
          path: build/dist

      # This job publishes a 7-day workflow artifact, not a release: there is
      # nothing distributable to attest, and nothing that could verify it later.
      # Attestation belongs to the path that cuts a real `testing` pre-release
      # (#148), which should mirror release.yml - package with attest: 'true',
      # sign the manifest, publish with --prerelease. A testing release must be
      # signed regardless: the updater refuses a manifest it cannot verify, so an
      # unsigned pre-release is invisible to the channel that is meant to find it.
      - name: package
        uses: ./.github/actions/package
        with:
          version: ${{ needs.build.outputs.version }}
          channel: testing
          attest: 'false'

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ needs.check.outputs.version }}
          path: |
            build/dist/*.exe
            build/dist/*.zip
            build/dist/*.sha512
          retention-days: 7
