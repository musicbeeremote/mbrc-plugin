name: supply-chain

# Advisories, licences, duplicate versions and source registries, over both
# Cargo workspaces. The api-debugger is excluded from the root workspace and
# resolves its own graph, so a single run would miss most of its dependencies.
#
# This overlaps Dependabot without replacing it, in both directions: cargo-deny
# reads the RustSec database and filters by build target, so it catches Rust
# advisories Dependabot has not mirrored and skips crates that never compile for
# Windows; Dependabot covers the npm lockfile, which cargo-deny cannot see.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New advisories land against unchanged code, so a PR-only gate would go
    # stale between releases.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plugin
            manifest: Cargo.toml
          - name: api-debugger
            manifest: tools/api-debugger/src-tauri/Cargo.toml
    env:
      # renovate: datasource=github-releases depName=EmbarkStudios/cargo-deny
      DENY_VERSION: 0.20.2
      # The archive's digest for that version: a bump changes both.
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: ./.github/actions/release-tool
        with:
          repository: EmbarkStudios/cargo-deny
          tag: ${{ env.DENY_VERSION }}
          archive: cargo-deny-${{ env.DENY_VERSION }}-x86_64-unknown-linux-musl.tar.gz
          sha256: ${{ env.DENY_SHA256 }}
          binary: cargo-deny
          strip-components: "1"

      # Warnings are not failures here: `multiple-versions` is a warning by
      # policy, and a mid-upgrade duplicate should not redden the tree.
      - name: Check
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo-deny --all-features --manifest-path "$MANIFEST" check

  machete:
    name: unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Covers both workspaces: it walks the directory, not one manifest. A
      # dependency named nowhere in the source is still fetched, built and
      # audited, so an unused one is cost with nothing behind it. The scan is
      # textual, so a crate pulled in only to select another's feature reads as
      # unused; those are recorded per crate under
      # `[package.metadata.cargo-machete]`.
      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
