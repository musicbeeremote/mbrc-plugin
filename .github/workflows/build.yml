name: build

# Reusable build for the plugin bundle. Called by ci.yml, release.yml and
# nightly.yml so the MSBuild + Rust steps exist in exactly one place.
#
# Version handling: callers pass EITHER a full `version` (release, from the tag)
# OR a `version-suffix` appended to VersionPrefix from Directory.Build.props
# (ci, nightly). The resolved value is passed to MSBuild as /p:Version so the
# assembly version and the packaged filenames can never disagree, and is
# re-exported as the `version` output for the packaging step.
on:
  workflow_call:
    inputs:
      version:
        description: 'Full version, e.g. 1.5.0. A leading "v" is stripped. Wins over version-suffix.'
        type: string
        default: ''
      version-suffix:
        description: 'Prerelease suffix appended to VersionPrefix, e.g. nightly.20260729. No leading dash.'
        type: string
        default: ''
      artifact-name:
        description: 'Name of the uploaded build/dist artifact.'
        type: string
        required: true
      run-format-check:
        description: 'Run dotnet format --verify-no-changes.'
        type: boolean
        default: false
      run-tests:
        description: 'Run the xUnit suite.'
        type: boolean
        default: false
      upload-coverage:
        description: 'Upload coverage to Codecov. Requires run-tests and the CODECOV_TOKEN secret.'
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
    outputs:
      version:
        description: 'The resolved full version string.'
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'  # kept in sync with global.json

      - name: setup NuGet
        uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      # The plugin build invokes build.ps1 -Rust (MSBuild BuildRustCore target),
      # which compiles mbrc_core.dll for i686. The runner ships Rust; we just add
      # the 32-bit target the plugin links against.
      - name: setup Rust (i686 target)
        run: rustup target add i686-pc-windows-msvc

      - name: cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: restore packages
        run: nuget restore MBRC.sln -OutputDirectory .nuget -NonInteractive -LockedMode

      - name: resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SUFFIX: ${{ inputs.version-suffix }}
        run: |
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION -replace '^v', ''
          } else {
            $xml = [xml](Get-Content Directory.Build.props)
            $prefix = ($xml.Project.PropertyGroup.VersionPrefix | Where-Object { $_ }).Trim()
            if (-not $prefix) {
              Write-Error "VersionPrefix not found in Directory.Build.props"
              exit 1
            }
            if ($env:INPUT_SUFFIX) {
              # Single dash: MSBuild's own VersionPrefix/VersionSuffix join uses one,
              # and the packaged filenames are derived from this same string.
              $version = "$prefix-$($env:INPUT_SUFFIX)"
            } else {
              $version = $prefix
            }
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          # Also into the job environment, so EVERY later step builds the same
          # version - not just the one step that passes /p:Version. `dotnet test`
          # rebuilds the plugin project it references, and without this it
          # re-stamped mb_remote.dll with the bare VersionPrefix and the dist copy
          # shipped that (see Directory.Build.props). Read by the managed build via
          # Directory.Build.props and by the Rust core via mbrc-buildinfo.
          echo "MBRC_VERSION=$version" >> $env:GITHUB_ENV
          echo "Building version: $version"

      - name: check code formatting
        if: inputs.run-format-check
        run: |
          echo "Checking code formatting..."
          echo "Running dotnet format --verify-no-changes"
          dotnet format --verify-no-changes --verbosity normal
          if ($LASTEXITCODE -ne 0) {
            echo "❌ Code formatting issues found! Run 'dotnet format' to fix them."
            echo "Note: Some analyzer warnings (CA####) are expected and don't affect formatting."
            exit 1
          }
          echo "✅ Code formatting is clean!"

      - name: build with strict analysis
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          # MBRC_VERSION is exported to the whole job by the resolve step above,
          # so it reaches this build, the test step's implicit rebuild, and the
          # Rust core (mbrc-buildinfo) alike. Without it a prerelease build calls
          # itself the final version - in its log lines, in the mDNS TXT record,
          # and in the update check.
        run: |
          echo "🔍 Building with strict static analysis (warnings as errors)..."
          msbuild MBRC.sln /p:Configuration="Release" /p:MSBuildCI="true" /p:Version=$env:VERSION /m /v:M /fl /nr:false

      - name: run tests with coverage
        if: inputs.run-tests
        run: |
          dotnet test tests/csharp/MusicBeeRemote.Core.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: upload coverage to Codecov
        if: inputs.run-tests && inputs.upload-coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./TestResults
          flags: csharp
          fail_ci_if_error: false
          verbose: true

      # The stamp is what the updater compares, and it being wrong is invisible in
      # a green build: beta.1 and beta.2 both shipped mis-stamped and nothing
      # noticed until a tester was never offered an update. Checked after every
      # step that could have rebuilt the assembly, and immediately before the
      # bytes are copied for shipping.
      - name: verify the stamped version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $dll = "build/bin/plugin/Release/net48/mb_remote.dll"
          $stamped = (Get-Item $dll).VersionInfo.ProductVersion
          # InformationalVersion carries "+<sha>" build metadata; the part before
          # it is the version the update check actually compares.
          $core = $stamped.Split('+')[0]
          echo "stamped: $stamped"
          if ($core -ne $env:VERSION) {
            Write-Error "mb_remote.dll is stamped '$core' but this build is '$env:VERSION'. A later step rebuilt it without the version - shipping this would tell every client the wrong version."
            exit 1
          }
          echo "✅ stamped version matches $env:VERSION"

      - name: copy to dist
        run: |
          mkdir -p build/dist
          cp build/bin/plugin/Release/net48/mb_remote.dll build/dist
          # Native core (Release -> the `plugin` cargo profile); must ship next to
          # mb_remote.dll. Not embedded by Costura (managed-only).
          cp target/i686-pc-windows-msvc/plugin/mbrc_core.dll build/dist
          # Elevated helper, built alongside the core by build.ps1 -Rust.
          cp target/i686-pc-windows-msvc/plugin/mbrc-helper.exe build/dist
          # Prefixed, and not because it is tidier: the zip is extracted straight
          # into MusicBee's Plugins folder, where a `README.txt` lands on top of
          # MusicBee's own `readme.txt` - same file, Windows being
          # case-insensitive. These names collide with nothing and are obviously
          # ours, so an uninstall can remove them.
          cp LICENSE build/dist/MBRC_LICENSE.txt
          cp installer/README.txt build/dist/MBRC_README.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: build/dist
