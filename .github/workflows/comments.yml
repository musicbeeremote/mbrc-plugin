name: comments

# The comment rules from CLAUDE.md, over the whole tree.
#
# Its own workflow rather than a step in rust.yml because the rules cover C# as
# well as Rust, and rust.yml is behind a path filter that a C#-only change does
# not match.
#
# Whole-tree rather than diff-scoped: the tree is clean, so anything this finds
# is new, and a rule that only looked at changed lines would let a file drift
# the moment nobody touched it. It runs `tools/mbrc-lint` - the same tool the
# pre-commit hook runs - so a local pass and a remote pass cannot disagree.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: comments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: comment rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=crate-ci/typos
      TYPOS_VERSION: v1.51.1
      # The archive's digest for that version: a bump changes both.
      TYPOS_SHA256: 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: comment rules
        run: cargo run -q -p mbrc-lint --locked -- --all

      - name: Install typos
        uses: ./.github/actions/release-tool
        with:
          repository: crate-ci/typos
          tag: ${{ env.TYPOS_VERSION }}
          archive: typos-${{ env.TYPOS_VERSION }}-x86_64-unknown-linux-musl.tar.gz
          sha256: ${{ env.TYPOS_SHA256 }}
          binary: typos

      # A curated misspellings list rather than a dictionary, so it is safe to
      # fail a PR on. `_typos.toml` records the few places it is wrong here.
      - name: spelling
        run: typos
