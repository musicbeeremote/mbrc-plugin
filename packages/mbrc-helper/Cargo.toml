[package]
name = "mbrc-helper"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Elevated helper for MusicBee Remote: firewall rule creation and staged-update application."

[[bin]]
name = "mbrc-helper"
path = "src/main.rs"

[dependencies]
mbrc-update.workspace = true

# COM interface wrappers (INetFwPolicy2/INetFwRule) exist only in `windows`, not
# in `windows-sys`, which is why this crate takes the heavier of the two. It is
# confined to the helper binary: mbrc-core depends on mbrc-update, never on this
# crate, so mbrc_core.dll does not grow.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
