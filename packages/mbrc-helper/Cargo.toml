[package]
name = "mbrc-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
authors.workspace = true
description = "Elevated helper for MusicBee Remote: firewall rule creation and staged-update application."

[[bin]]
name = "mbrc-helper"
path = "src/main.rs"

[dependencies]
# Without the `client` feature: the helper verifies manifests and applies staged
# files, so it has no use for the HTTP/check/stage half. The workspace
# declaration turns the default features off and the core opts back in.
#
# Cargo unifies features per build, so a single `cargo build -p mbrc-core -p
# mbrc-helper` still compiles one mbrc-release with `client` on for both. What
# this buys is the dependency edge: nothing the helper calls can reach into that
# half, and building the helper on its own does not pull semver/zip/time in.
mbrc-release.workspace = true

[build-dependencies]
mbrc-buildinfo.workspace = true

# COM interface wrappers (INetFwPolicy2/INetFwRule) exist only in `windows`, not
# in `windows-sys`, which is why this crate takes the heavier of the two.
#
# Keeping the helper in its own crate is what confines that dependency to the
# exe. #149 makes mbrc-core depend on mbrc-release for the update check, so a
# helper bin target living inside mbrc-release would put `windows` in the core's
# graph -- Cargo dependencies are per-crate, not per-target. Nothing depends on
# this crate, so mbrc_core.dll does not grow.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_System_Threading",
    # GetCurrentPackageFamilyName: the helper records whether it is running
    # inside a package container, because a helper that broke out of one logs to
    # a path that can belong to a different install entirely.
    "Win32_Storage_Packaging_Appx",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[lints]
workspace = true
