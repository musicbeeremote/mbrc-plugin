[package]
name = "mbrc-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

# cdylib -> mbrc_core.dll (the native library the C# plugin loads at cutover).
# rlib   -> lets integration tests / the replay harness link the core in-process.
[lib]
name = "mbrc_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = "=1.3.1"
# Cover decode/encode (moving cover handling into the core; C# hands over raw
# artwork). Pure-Rust decoders, so it cross-compiles to i686 with no C toolchain.
# `gif` is included because some MusicBee libraries carry GIF album art (GDI+
# decoded it; without this feature the core skips those covers).
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
# SIMD (SSE4.1/AVX2) image resizing - the actual downscale is the from-scratch
# build's bottleneck, and this is several times faster than image's scalar
# `imageops::resize`. Pure Rust with runtime CPU detection, so i686 stays clean.
fast_image_resize = "=6.1.0"
base64 = "=0.23.1"
# Embedded key-value store backing the durable caches (album-cover index +
# library metadata cache) in one `mbrc.redb` file. Pure Rust, no C
# toolchain, and redb removed mmap in 2.0 so it does its own buffered/paged I/O
# - a good fit for the 32-bit i686 target (no mmap address-space ceiling).
redb = "=4.1.0"
# SHA1 for cover cache identities (album key + content hash). Not cryptographic;
# must byte-match the C# HashingUtilities (lowercase hex). Pure Rust, i686 OK.
sha1 = "=0.11.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
# gzip for rolled log generations. `rust_backend` (miniz_oxide) is pure Rust, so
# i686-msvc cross-compiles with no C/zlib toolchain.
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
# Writing the diagnostics bundle. Same version and features mbrc-release already
# pins for reading update zips, so this adds no crate to the graph: mbrc-core
# takes mbrc-release with `client`, which already compiles zip in. `deflate-flate2`
# rides on the pure-Rust miniz_oxide above, so i686-msvc stays free of a C
# toolchain.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
# Cross-platform process RSS for the O(page) memory proof (validation plan): a
# periodic + per-reconcile log line so a paging sweep on a huge library shows
# resident memory staying flat. Pure bindings (GetProcessMemoryInfo on Windows),
# i686-msvc clean; only sampled when the log level admits it.
memory-stats = "=1.2.0"
tokio = { workspace = true }
mbrc-wire = { workspace = true }
# The update pipeline: manifest verification plus the check/download/stage half
# (`client`), which the helper deliberately does not take.
mbrc-release = { workspace = true, features = ["client"] }
time = { workspace = true }
if-addrs = { workspace = true }
socket2 = "=0.6.5"
# mDNS / DNS-SD advertisement (#160), additive to the custom UDP responder. Pure
# Rust with no async-runtime dependency of its own - it runs its own daemon
# thread - so i686-msvc stays free of a C toolchain. `logging` is left off: the
# crate would pull in `log`, and the core's logging goes through `tracing`.
mdns-sd = { version = "=0.21.0", default-features = false }

# ShellExecuteExW (the elevation prompt for the update helper) and the loader
# calls that answer "which directory was this DLL loaded from", which is how the
# plugins directory is derived rather than taken from the caller. `windows-sys`
# and not `windows`: flat C API, no COM.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    # FILE_SHARE_READ: the staged helper is opened denying write and delete
    # sharing so it cannot be swapped between verification and launch.
    "Win32_Storage_FileSystem",
    # SHELLEXECUTEINFOW carries an HKEY field, so the struct lives behind the
    # registry feature even though nothing here touches the registry.
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # GetCurrentApplicationUserModelId, to tell a packaged (Store) MusicBee from
    # an ordinary one. A packaged app cannot be started by path, so the update
    # helper has to be told the identity to activate instead.
    "Win32_Storage_Packaging_Appx",
    # CreateProcessW with a proc-thread attribute list: a packaged app's children
    # leave the package container by default, so the update helper has to be
    # started with PROCESS_CREATION_DESKTOP_APP_BREAKAWAY_OVERRIDE to see the
    # same redirected paths the core does.
    "Win32_System_Threading",
    # PROCESS_CREATION_DESKTOP_APP_BREAKAWAY_OVERRIDE lives here, not beside the
    # attribute constant it is a value for.
    "Win32_System_WindowsProgramming",
] }

[build-dependencies]
mbrc-buildinfo = { workspace = true }
csbindgen = "=1.9.8"
syn = { version = "=3.0.3", features = ["full"] }

[dev-dependencies]
mbrc-capture = { workspace = true }
serde_json = { workspace = true }
# Property-based fuzzing of the untrusted decode paths (cover artwork + settings
# msgpack) on stable. rmp-serde is re-declared here so the integration test can
# call the decoder directly (crate deps aren't visible to integration tests).
proptest = "=1.11.0"
rmp-serde = "=1.3.1"

[lints]
workspace = true
